<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fabric">
  <title>Fabric</title>
  <!-- Microsoft Fabric. An original interlaced-weave mark in the Fabric teal gradient, NOT a
       trace of the official logo (that mark is trademarked and not CC0 like the Salesforce
       cloud next door). Two warp and two weft bands alternate over/under in a checkerboard,
       which is what makes it read as "fabric" rather than as a plain grid.
       Chunky bands, no hairlines, so it survives the 20px Fleet row. -->
  <defs>
    <linearGradient id="fabricTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DBFB8"/>
      <stop offset="1" stop-color="#0B7C8A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#fabricTile)"/>
  <g fill="#ffffff">
    <!-- weft (horizontal) -->
    <rect x="8" y="16" width="48" height="12" rx="2.5"/>
    <rect x="8" y="36" width="48" height="12" rx="2.5"/>
    <!-- warp (vertical) drawn over the weft, separated by tile-coloured gutters -->
    <rect x="16" y="8" width="12" height="48" rx="2.5" stroke="#0B7C8A" stroke-width="2.5"/>
    <rect x="36" y="8" width="12" height="48" rx="2.5" stroke="#0B7C8A" stroke-width="2.5"/>
    <!-- two crossings flipped back so the weave alternates -->
    <path d="M34.8 16h14.4v12H34.8z"/>
    <path d="M14.8 36h14.4v12H14.8z"/>
  </g>
  <g stroke="#0B7C8A" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M34.8 16.2h14.4M34.8 27.8h14.4"/>
    <path d="M14.8 36.2h14.4M14.8 47.8h14.4"/>
  </g>
</svg>
